<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SALEVIX - POS | VELTORA</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{background:#F2F5F9}
.topbar{background:#0A1931;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.topbar b{font-size:22px;letter-spacing:1px}.topbar b span{color:#0A6ED1}
.topbar small{color:#C9A227;letter-spacing:2px}
.main{display:grid;grid-template-columns:1fr 380px;gap:16px;padding:16px;height:calc(100vh - 60px)}
.left{background:#fff;border-radius:14px;padding:16px;overflow-y:auto}
.search{display:flex;gap:10px}
.search input{flex:1;padding:12px;border:1px solid #ddd;border-radius:10px;outline:none;font-size:15px}
.search button{padding:12px 20px;background:#0A6ED1;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.cats{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.cats button{padding:8px 16px;border:1px solid #ddd;background:#fff;border-radius:20px;cursor:pointer;font-weight:600}
.cats button.active{background:#0A1931;color:#fff}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pcard{border:1px solid #eee;border-radius:12px;padding:14px;cursor:pointer;text-align:center;transition:.2s}
.pcard:hover{border-color:#0A6ED1;transform:scale(1.02)}
.pcard .emoji{font-size:32px}
.pcard b{display:block;margin-top:8px;font-size:14px}
.pcard span{color:#0A6ED1;font-weight:800}
.pcard small{color:#888}
.right{background:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column}
.right h3{margin-bottom:4px}
.right small{color:#888}
.cart{flex:1;overflow-y:auto;margin:14px 0}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}
.cart-item b{font-size:13px}
.cart-item small{color:#888}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid #ddd;background:#fff;cursor:pointer;font-weight:800}
.empty{text-align:center;color:#aaa;padding:40px 0;font-size:14px}
.totals{border-top:2px dashed #eee;padding-top:12px;font-size:14px}
.totals div{display:flex;justify-content:space-between;padding:4px 0}
.totals .grand{font-size:18px;font-weight:800;color:#0A1931}
.totals input{width:80px;padding:6px;border:1px solid #ddd;border-radius:8px;text-align:center}
.payBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.payBtns button{padding:14px;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:15px}
.cashBtn{background:#16a34a;color:#fff}
.printBtn{background:#0A1931;color:#fff}
.changeBox{background:#FFF8E1;padding:10px;border-radius:10px;margin-top:10px;font-size:14px;text-align:center;font-weight:700;display:none}
.back{color:#fff;text-decoration:none;font-size:13px}
@media(max-width:900px){.main{grid-template-columns:1fr;height:auto}.products{grid-template-columns:repeat(2,1fr)}}
@media print{body *{visibility:hidden}.right,.right *{visibility:visible}.right{position:fixed;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div class="topbar">
  <div><b>SALE<span>VIX</span></b> <small>BY VELTORA</small></div>
  <div style="font-size:13px">🏪 Lahore Branch &nbsp; | &nbsp; 👤 Fahad (Cashier) &nbsp; | &nbsp; <a class="back" href="retail.html">← Dashboard</a></div>
</div>

<div class="main">
  <!-- LEFT PRODUCTS -->
  <div class="left">
    <div class="search">
      <input id="searchBox" placeholder="🔍 Product dhoondo... Milk, Bread..." onkeyup="searchP()">
      <button onclick="alert('Barcode Scan jald aayega!')">📷 Scan</button>
    </div>
    <div class="cats">
      <button class="active" onclick="filterCat('all',this)">All</button>
      <button onclick="filterCat('grocery',this)">Grocery</button>
      <button onclick="filterCat('dairy',this)">Dairy</button>
      <button onclick="filterCat('bakery',this)">Bakery</button>
      <button onclick="filterCat('drinks',this)">Drinks</button>
    </div>
    <div class="products" id="productGrid"></div>
  </div>

  <!-- RIGHT CART -->
  <div class="right">
    <h3>🧾 Current Bill - #1005</h3>
    <small>Customer: Walk-in Customer</small>
    <div class="cart" id="cartBox"><div class="empty">Cart khaali hai<br>Product pe click karo 👈</div></div>
    <div class="totals">
      <div><span>Sub Total:</span><b id="subTotal">Rs. 0</b></div>
      <div><span>Discount:</span><span><input id="discount" type="number" value="0" oninput="renderCart()"> Rs.</span></div>
      <div><span>Cash Diya:</span><span><input id="cashGiven" type="number" value="0" oninput="calcChange()"> Rs.</span></div>
      <div class="grand"><span>Total:</span><span id="grandTotal">Rs. 0</span></div>
    </div>
    <div class="changeBox" id="changeBox">Wapis: Rs. 0</div>
    <div class="payBtns">
      <button class="cashBtn" onclick="checkout()">💵 Cash Sale</button>
      <button class="printBtn" onclick="window.print()">🖨️ Print Bill</button>
    </div>
    <button onclick="clearCart()" style="margin-top:10px;padding:10px;border:1px solid #ffcccc;background:#fff;color:red;border-radius:10px;cursor:pointer;font-weight:700">🗑️ Cart Clear Karein</button>
  </div>
</div>

<script>
let products=[
{id:1,name:"Milk 1L",price:280,cat:"dairy",emoji:"🥛",stock:20},
{id:2,name:"Bread",price:150,cat:"bakery",emoji:"🍞",stock:15},
{id:3,name:"Eggs Dozen",price:360,cat:"dairy",emoji:"🥚",stock:30},
{id:4,name:"Shampoo",price:550,cat:"grocery",emoji:"🧴",stock:10},
{id:5,name:"Rice 5kg",price:1250,cat:"grocery",emoji:"🍚",stock:8},
{id:6,name:"Coca Cola 1L",price:220,cat:"drinks",emoji:"🥤",stock:25},
{id:7,name:"Biscuit Pack",price:120,cat:"bakery",emoji:"🍪",stock:40},
{id:8,name:"Tea 500g",price:950,cat:"grocery",emoji:"🍵",stock:12},
{id:9,name:"Cooking Oil 1L",price:650,cat:"grocery",emoji:"🫗",stock:9},
{id:10,name:"Juice 1L",price:320,cat:"drinks",emoji:"🧃",stock:18},
{id:11,name:"Butter",price:480,cat:"dairy",emoji:"🧈",stock:14},
{id:12,name:"Cake Rusk",price:280,cat:"bakery",emoji:"🍰",stock:22},
];
let cart={};
let currentCat='all';

function showProducts(){
  let q=document.getElementById('searchBox').value.toLowerCase();
  let grid=document.getElementById('productGrid');
  grid.innerHTML='';
  products.filter(p=>(currentCat==='all'||p.cat===currentCat) && p.name.toLowerCase().includes(q)).forEach(p=>{
    grid.innerHTML+=`<div class="pcard" onclick="addToCart(${p.id})"><div class="emoji">${p.emoji}</div><b>${p.name}</b><span>Rs. ${p.price}</span><br><small>Stock: ${p.stock}</small></div>`;
  });
}
function filterCat(c,btn){
  currentCat=c;
  document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  showProducts();
}
function searchP(){showProducts()}
function addToCart(id){
  if(cart[id]) cart[id]++; else cart[id]=1;
  renderCart();
}
function changeQty(id,delta){
  cart[id]+=delta;
  if(cart[id]<=0) delete cart[id];
  renderCart();
}
function renderCart(){
  let box=document.getElementById('cartBox');
  let sub=0;
  if(Object.keys(cart).length===0){
    box.innerHTML='<div class="empty">Cart khaali hai<br>Product pe click karo 👈</div>';
  } else {
    box.innerHTML='';
    for(let id in cart){
      let p=products.find(x=>x.id==id);
      let total=p.price*cart[id];
      sub+=total;
      box.innerHTML+=`<div class="cart-item"><div><b>${p.emoji} ${p.name}</b><br><small>Rs. ${p.price} x ${cart[id]}</small></div><div class="qty"><button onclick="changeQty(${id},-1)">-</button><b>${cart[id]}</b><button onclick="changeQty(${id},1)">+</button><b style="margin-left:8px">Rs. ${total}</b></div></div>`;
    }
  }
  let disc=parseInt(document.getElementById('discount').value)||0;
  let grand=sub-disc;
  if(grand<0) grand=0;
  document.getElementById('subTotal').innerText='Rs. '+sub;
  document.getElementById('grandTotal').innerText='Rs. '+grand;
  calcChange();
}
function calcChange(){
  let grand=parseInt(document.getElementById('grandTotal').innerText.replace('Rs. ',''))||0;
  let cash=parseInt(document.getElementById('cashGiven').value)||0;
  let change=cash-grand;
  let box=document.getElementById('changeBox');
  if(cash>0){
    box.style.display='block';
    box.innerText = change>=0 ? 'Wapis Dena Hai: Rs. '+change : 'Aur Chahiye: Rs. '+Math.abs(change);
  } else box.style.display='none';
}
function checkout(){
  if(Object.keys(cart).length===0){alert('Pehle product add karo!');return;}
  let grand=document.getElementById('grandTotal').innerText;
  alert('✅ Sale Ho Gayi!\nBill #1005\nTotal: '+grand+'\nShukriya!');
  clearCart();
}
function clearCart(){
  cart={};
  document.getElementById('discount').value=0;
  document.getElementById('cashGiven').value=0;
  renderCart();
}
showProducts();
renderCart();
</script>
</body>
</html>
